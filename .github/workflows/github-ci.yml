name: GitHub CI

on:
  push:
  pull_request:
  schedule:
    # https://crontab.guru/
    # At 12:00 AM, only on Monday
    - cron: 0 0 * * 1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install requirements
        run: |
          go install golang.org/x/tools/cmd/goimports@latest

      - name: Check Go format
        run: |
          if [ -n "$(goimports -l .)" ]; then
            echo "Go files are not formatted correctly by goimports. Please run 'goimports -w .' to fix."
            goimports -d . # Show the diff for better understanding
            exit 1
          fi

      - name: Check YAML format
        uses: docker://ghcr.io/google/yamlfmt:latest
        with:
          args: -lint .

      - name: Check Markdown format
        uses: DavidAnson/markdownlint-cli2-action@992badcdf24e3b8eb7e87ff9287fe931bcb00c6e # v20
        with:
          globs: |
            **/*.md
            !docs/themes/adidoks/**/*.md

  audit:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        if: ${{ github.event_name == 'pull_request' }}
        with:
          comment-summary-in-pr: always

      - name: Run Security Scanner
        uses: securego/gosec@fddb9427b874cb5177d0b52a31b293deeb83c1b4 # master
        with:
          args: -confidence low -enable-audit -tests -track-suppressions -no-fail -fmt sarif -sort -out results.sarif -stdout -verbose=text ./...

      - name: Upload Static Analysis Results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif

  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: go
            build-mode: autobuild

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{matrix.language}}'

  build:
    needs: [fmt, audit, analyze]
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        go-version: [stable]
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: |
          go env -w CGO_ENABLED=0
          go build -o bin/ ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@e7fa5ac41e1cf5b7d48e45e42232ce7ada589601 # v8
        with:
          version: latest

      - name: Test
        run: |
          go env -w CGO_ENABLED=1
          go test -v -timeout 30s -race -shuffle on ./...

  coverage:
    needs: build
    runs-on: ubuntu-latest

    env:
      CGO_ENABLED: 0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install requirements
        run: |
          go install github.com/jstemmer/go-junit-report@latest
          go install github.com/jandelgado/gcov2lcov@latest

      - name: Generate the tests and code coverage reports
        run: |
          go test -v -coverpkg=./... -coverprofile=coverage.out -json ./... | tee test.json
          cat test.json | go-junit-report > report.xml
          go tool cover -html coverage.out -o coverage.html
          gcov2lcov -infile=coverage.out -outfile=coverage.lcov

      - name: Upload the test report to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@47f89e9acb64b76debcd5ea40642d25a4adced9f # v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: report.xml

      - name: Upload the code coverage report to Codecov
        uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7 # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          flags: unittests
          name: codecov-umbrella

      - name: Upload the code coverage report to Codacy
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: ./coverage.lcov

      - name: Upload the code coverage report to DeepSource
        uses: deepsourcelabs/test-coverage-action@4284bb73a04adb39faaa6bfcc2d0e3dd137ffed7 # v1
        with:
          key: go
          coverage-file: coverage.out
          dsn: ${{ secrets.DEEPSOURCE_DSN }}

      - name: Upload the code coverage report to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage.html

      - name: Refresh the Go Report card
        if: github.ref == 'refs/heads/main'
        run: |
          curl -X POST -F "repo=github.com/${{ github.repository }}" https://goreportcard.com/checks
